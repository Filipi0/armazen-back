openapi: 3.0.0
info:
  title: API do ArmaZen
  version: 1.1.0
  description: Documentação da API de usuários, administradores, produtos e controle de estoque

servers:
  - url: http://localhost:4000/api
    description: Servidor Local

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []

paths:
  /register/admin:
    post:
      summary: Cria um novo administrador
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "admin@email.com"
                password:
                  type: string
                  example: "123456"
                name:
                  type: string
                  example: "Admin Teste"  
      responses:
        201:
          description: Administrador criado com sucesso
        500:
          description: Erro ao registrar administrador

  /register:
    post:
      summary: Cria um novo usuário (Apenas Admin pode criar)
      tags:
        - Usuário
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "user@email.com"
                password:
                  type: string
                  example: "123456"
                name:
                  type: string
                  example: "Usuário Teste"
      responses:
        201:
          description: Usuário criado com sucesso
        403:
          description: Acesso negado
        500:
          description: Erro ao registrar usuário

  /login:
    post:
      summary: Realiza login e retorna um token JWT
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "user@email.com"
                password:
                  type: string
                  example: "123456"
      responses:
        200:
          description: Login realizado com sucesso
        401:
          description: Credenciais inválidas
        500:
          description: Erro ao realizar login

  /users:
    get:
      summary: Lista todos os usuários cadastrados pelo administrador autenticado
      tags:
        - Usuário
      security:
        - BearerAuth: []
      responses:
        200:
          description: Lista de usuários retornada com sucesso
        403:
          description: Acesso negado
        500:
          description: Erro ao buscar usuários
  /users/{id}:
    delete:
      summary: Deleta um usuário (Apenas Admin)
      tags:
        - Usuário
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID do usuário a ser deletado
      responses:
        200:
          description: Usuário deletado com sucesso
        403:
          description: Acesso negado
        500:
          description: Erro ao deletar usuário
  /users/{id}/password:
    put:
      summary: Atualiza a senha de um usuário (Admin ou o próprio usuário)
      tags:
        - Usuário
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID do usuário a ter a senha alterada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword:
                  type: string
                  example: "novaSenha123"
      responses:
        200:
          description: Senha atualizada com sucesso
        403:
          description: Acesso negado
        500:
          description: Erro ao atualizar a senha do usuário

  /products:
    post:
      summary: Cadastra um novo produto (Apenas Admin)
      tags:
        - Produtos
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemType:
                  type: string
                  example: "Eletrônico"
                supplier:
                  type: string
                  example: "Fornecedor X"
                name:
                  type: string
                  example: "Teclado Mecânico"
                quantity:
                  type: integer
                  example: 10
                unit:
                  type: string
                  example: "unidade"
                expirationDate:
                  type: string
                  format: date
                  example: "2025-12-31"
      responses:
        201:
          description: Produto cadastrado com sucesso
        403:
          description: Acesso negado
        500:
          description: Erro ao cadastrar produto

    get:
      summary: Lista os produtos disponíveis (Admin e Usuários vinculados)
      tags:
        - Produtos
      security:
        - BearerAuth: []
      responses:
        200:
          description: Lista de produtos retornada com sucesso
        403:
          description: Acesso negado
        500:
          description: Erro ao buscar produtos

  /products/{id}:
    delete:
      summary: Deleta um produto (Apenas Admin que cadastrou)
      tags:
        - Produtos
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID do produto a ser deletado
      responses:
        200:
          description: Produto deletado com sucesso
        403:
          description: Acesso negado
        500:
          description: Erro ao deletar produto


  /stock/move:
    post:
      summary: Registra uma movimentação de estoque
      tags:
        - Estoque
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: integer
                  example: 1
                quantity:
                  type: integer
                  example: 5
                movementType:
                  type: string
                  enum: [entrada, saida]
                  example: "entrada"
      responses:
        200:
          description: "Movimentação registrada com sucesso"
        400:
          description: "Erro na requisição (exemplo: tipo de movimentação inválido)"
        404:
          description: "Produto não encontrado"
        500:
          description: "Erro ao registrar movimentação"

  /stock/movements:
    get:
      summary: Lista todas as movimentações de estoque
      tags:
        - Estoque
      security:
        - BearerAuth: []
      responses:
        200:
          description: "Retorna uma lista de movimentações de estoque"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    productId:
                      type: integer
                      example: 1
                    movementType:
                      type: string
                      enum: [entrada, saida]
                      example: "saida"
                    quantity:
                      type: integer
                      example: 5
                    createdAt:
                      type: string
                      format: date-time
                      example: "2025-03-20T12:00:00Z"
                    user:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 3
                        name:
                          type: string
                          example: "Usuário Teste"
                        email:
                          type: string
                          example: "user@email.com"
                    userAdmin:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: "Admin Teste"
                        email:
                          type: string
                          example: "admin@email.com"
        500:
          description: "Erro ao buscar movimentações"



  
  /stock-summary:
  get:
    summary: Obtém um resumo da situação do estoque
    tags:
      - Estoque
    security:
      - BearerAuth: []
    responses:
      200:
        description: Retorna um resumo dos produtos no estoque
        content:
          application/json:
            schema:
              type: object
              properties:
                nearExpiration:
                  type: integer
                  example: 5
                lowStock:
                  type: integer
                  example: 10
                expiredThisMonth:
                  type: integer
                  example: 3
                outOfStockThisMonth:
                  type: integer
                  example: 7
                untouchedThisMonth:
                  type: integer
                  example: 15
                mostMovedItems:
                  type: integer
                  example: 5
      403:
        description: Acesso negado
      500:
        description: Erro ao buscar resumo do estoque

/stock-details/near-expiration:
  get:
    summary: Lista produtos próximos do vencimento (10 dias antes)
    tags:
      - Estoque
    security:
      - BearerAuth: []
    responses:
      200:
        description: Retorna a lista de produtos próximos do vencimento
      403:
        description: Acesso negado
      500:
        description: Erro ao buscar produtos próximos do vencimento

/stock-details/low-stock:
  get:
    summary: Lista produtos prestes a esgotar (≤ 15 unidades)
    tags:
      - Estoque
    security:
      - BearerAuth: []
    responses:
      200:
        description: Retorna a lista de produtos prestes a esgotar
      403:
        description: Acesso negado
      500:
        description: Erro ao buscar produtos prestes a esgotar

/stock-details/expired-this-month:
  get:
    summary: Lista produtos expirados durante o mês
    tags:
      - Estoque
    security:
      - BearerAuth: []
    responses:
      200:
        description: Retorna a lista de produtos expirados no mês atual
      403:
        description: Acesso negado
      500:
        description: Erro ao buscar produtos expirados

/stock-details/out-of-stock-this-month:
  get:
    summary: Lista produtos esgotados durante o mês
    tags:
      - Estoque
    security:
      - BearerAuth: []
    responses:
      200:
        description: Retorna a lista de produtos esgotados no mês atual
      403:
        description: Acesso negado
      500:
        description: Erro ao buscar produtos esgotados

/stock-details/untouched-this-month:
  get:
    summary: Lista produtos não modificados durante o mês
    tags:
      - Estoque
    security:
      - BearerAuth: []
    responses:
      200:
        description: Retorna a lista de produtos que não foram modificados no mês
      403:
        description: Acesso negado
      500:
        description: Erro ao buscar produtos não modificados

/stock-details/most-moved-items:
  get:
    summary: Lista os produtos mais movimentados durante o mês
    tags:
      - Estoque
    security:
      - BearerAuth: []
    responses:
      200:
        description: Retorna a lista de produtos mais movimentados no mês atual
      403:
        description: Acesso negado
      500:
        description: Erro ao buscar produtos mais movimentados

  /stock-details:
    get:
      summary: Obtém detalhes dos produtos dentro de uma categoria específica
      tags:
        - Estoque
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: filterType
          required: true
          schema:
            type: string
            enum:
              [
                nearExpiration,
                lowStock,
                expiredThisMonth,
                outOfStockThisMonth,
                untouchedThisMonth,
                mostMovedItems,
              ]
          description: Tipo de filtro para os produtos no estoque
      responses:
        200:
          description: Retorna os detalhes dos produtos na categoria selecionada
        400:
          description: Filtro inválido
        403:
          description: Acesso negado
        500:
          description: Erro ao buscar detalhes dos produtos no estoque
